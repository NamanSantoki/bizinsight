global:
  environment: production
  domain: bizinsight.internal

backend:
  replicaCount: 2
  image:
    repository: bizinsight/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 512Mi
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
  env:
    DATABASE_URL: "postgresql://bizuser:bizpassword2026@postgres-postgresql:5432/bizinsight"
    REDIS_URL: "redis://redis-master:6379"
    OLLAMA_BASE_URL: "http://ollama-service:11434"
    OLLAMA_MODEL: "llama3"

frontend:
  replicaCount: 2
  image:
    repository: bizinsight/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.bizinsight.internal
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: bizinsight-tls-cert
      hosts:
        - app.bizinsight.internal

postgresql:
  enabled: true
  auth:
    username: bizuser
    password: bizpassword2026
    database: bizinsight

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false


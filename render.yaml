services:
  # ─── Backend (FastAPI) ───────────────────────────────────────────────────────
  - type: web
    name: bizinsight-backend
    runtime: docker
    image:
      url: docker.io/naman1267/bizinsight-backend:latest
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bizinsight-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bizinsight-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://bizinsight-frontend.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/data/raw
      - key: PROCESSED_DIR
        value: /tmp/data/processed
      - key: SAMPLES_DIR
        value: /tmp/data/samples
      - key: MODELS_DIR
        value: /tmp/ml/models

  # ─── Frontend (React/Vite static site) ──────────────────────────────────────
  - type: web
    name: bizinsight-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bizinsight-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── Redis ───────────────────────────────────────────────────────────────────
  - type: redis
    name: bizinsight-redis
    plan: free
    ipAllowList: []

# ─── PostgreSQL ──────────────────────────────────────────────────────────────
databases:
  - name: bizinsight-db
    plan: free
    databaseName: bizinsight
    user: bizinsight


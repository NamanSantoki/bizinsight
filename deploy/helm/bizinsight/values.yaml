replicaCount:
  backend: 1
  frontend: 1

image:
  repository: bizinsight
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

secrets:
  database_url: "postgresql+psycopg2://bizinsight:postgres@postgres.bizinsight.svc.cluster.local:5432/bizinsight"
  jwt_secret: "devjwtsecret1234567890abcdef"

resources:
  backend:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  frontend:
    limits:
      cpu: "300m"
      memory: "400Mi"
    requests:
      cpu: "150m"
      memory: "200Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  host: "bizinsight.local"
  annotations: {}

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "standard"

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "256Mi"
  persistence:
    enabled: true
    size: 500Mi
    storageClass: "standard"


name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-quality-and-security:
    name: Backend Test Suite & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff httpx

      - name: Lint and Code Formatting Check
        run: |
          ruff check backend/app

      - name: Run Backend Pytest Suite with Coverage
        run: |
          python -m pytest backend/tests -v --durations=10 --cov=backend/app --cov-report=term-missing

  frontend-build-and-lint:
    name: Frontend Lint & Production Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Lint Frontend Code
        run: npm run lint

      - name: Production TypeScript Build
        run: npm run build

  container-build-verification:
    name: Multi-stage Docker Container Builds
    runs-on: ubuntu-latest
    needs: [backend-quality-and-security, frontend-build-and-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: bizinsight/backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: bizinsight/frontend:ci-check
